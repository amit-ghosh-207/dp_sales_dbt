name: pre-commit-check

on:
  pull_request:
    branches: 
      - master
      - main

jobs:
  pre-commit-pip:
    name: Install pre-commit via pip
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        python-version: [3.8]

    # Set environment variables used throughout workflow
    env:
      DBT_PROFILES_DIR: .

    steps:

      - name: Checkout branch
        uses: actions/checkout@v3

    # Using bash and pip to install dbt and pre-commit
    # Update the dbt installation command to include the adapter you need
      - name: Install dbt and pre-commit
        shell: bash -l {0}
        run: |
          python -m pip install dbt-duckdb pre-commit

      - name: Install dbt dependencies
        shell: bash -l {0}
        working-directory: dp_sales_dbt
        run: |
          dbt deps

    # This action will output all the files that are being created and modified in our PR
      - name: Get changed files
        id: get_file_changes
        uses: trilom/file-changes-action@v1.2.4
        with:
          output: ' '

    # Transforming the output of get_file_changes to a string we can use for our next step
    # We want to take in account both new files and files that have been modified
      - name: Get changed .sql files in /models to lint
        id: get_files_to_lint
        shell: bash -l {0}
        run: |
          # Combine modified and added files, then filter for .sql files in the project's models folder
          FILES_MODIFIED="${{ steps.get_file_changes.outputs.files_modified }}"
          FILES_ADDED="${{ steps.get_file_changes.outputs.files_added }}"
          
          ALL_CHANGED_FILES="$FILES_MODIFIED $FILES_ADDED"
          
          FILES_TO_LINT=$(echo "$ALL_CHANGED_FILES" | tr -s ' ' '\n' | grep -E '^dp_sales_dbt/models/.*\.sql$' | tr -s '\n' ' ')
          
          # Modern way to set output in GitHub Actions
          echo "files=$FILES_TO_LINT" >> $GITHUB_OUTPUT

    # Finally run pre-commit
      - name: Run pre-commit
        shell: bash -l {0}
        run: |
          pre-commit run --files ${{ steps.get_files_to_lint.outputs.files }}