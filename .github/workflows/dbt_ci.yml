name: dbt Continuous Integration

on:
  pull_request:
    branches: [ "main", "master" ]

jobs:
  dbt-ci:
    name: dbt Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt and adapter
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb

      - name: Install dbt packages
        run: dbt deps
        working-directory: dp_sales_dbt

      - name: Create CI Profile
        run: |
          mkdir -p ~/.dbt
          echo "dp_sales_dbt:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: ci_test.duckdb
                schema: main
          " > ~/.dbt/profiles.yml

      - name: dbt Build
        run: dbt build --target ci --vars '{"ds": "2024-01-01"}'
        working-directory: dp_sales_dbt
