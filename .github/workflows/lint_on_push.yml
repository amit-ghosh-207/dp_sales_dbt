name: lint dbt project on push

on:
  push:
    branches-ignore:
      - 'master'
env:
  DBT_PROFILES_DIR: ./dp_sales_dbt

jobs:
  # this job runs SQLFluff with a specific set of rules
  # note the dialect is set to DuckDB, so make that specific to your setup
  # details on linter rules: https://docs.sqlfluff.com/en/stable/rules.html
  lint_project:
    name: Run SQLFluff linter
    runs-on: ubuntu-latest
  
    steps:
      - name: dbt-action
        uses: mwhitaker/dbt-action@master
          dbt_command: "dbt deps && dbt run && dbt test"
          dbt_project_folder: "dbt_project"