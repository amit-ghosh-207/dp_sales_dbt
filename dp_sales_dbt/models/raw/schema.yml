version: 2

models:
  - name: raw_customer
    description: "Raw landing table for customer profile information, including sensitive PII details."
    config:
      freshness:
        warn_after:
          count: 20
          period: hour
        error_after:
          count: 24
          period: hour
      loaded_at_field: load_ts
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - customer_hash_diff
            - filename
    columns:
      - name: customer_hash_diff
        description: "Hashed surrogate key used for change detection and record uniqueness."
        config:
          meta:
            contains_pii: true
        tests:
          - not_null
      - name: customer_id
        description: "Unique identifier for the customer from the source system."
        config:
          meta:
            contains_pii: true
      - name: customer_name
        description: "Full name of the customer."
        config:
          meta:
            contains_pii: true
      - name: customer_email
        description: "Customer's email address."
        config:
          meta:
            contains_pii: true
      - name: filename
        description: "Name of the source file processed for this record."
      - name: load_ts
        description: "Timestamp when the data was ingested into the raw layer."
  - name: raw_product
    description: "Raw staging table for product catalog data."
    config:
      freshness:
        warn_after:
          count: 20
          period: hour
        error_after:
          count: 24
          period: hour
      loaded_at_field: load_ts
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_hash_diff
            - filename
    columns:
      - name: product_hash_diff
        description: "Surrogate key representing a unique product record state."
        tests:
          - not_null
      - name: product_id
        description: "Source identifier for the product."
      - name: product_name
        description: "Marketing name of the product."
      - name: product_category_id
        description: "Reference to the product category identifier."
  - name: raw_product_category
    description: "Raw staging table for product category definitions."
    config:
      freshness:
        warn_after:
          count: 20
          period: hour
        error_after:
          count: 24
          period: hour
      loaded_at_field: load_ts
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_category_hash_diff
            - filename
    columns:
      - name: product_category_hash_diff
        description: "Surrogate key for the product category record."
        tests:
          - not_null
  - name: raw_sales
    description: "Raw landing table for transactional sales records."
    config:
      freshness:
        warn_after:
          count: 20
          period: hour
        error_after:
          count: 24
          period: hour
      loaded_at_field: load_ts
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - sales_hash_diff
            - filename
    columns:
      - name: sales_hash_diff
        description: "Surrogate key for a specific sales transaction."
        tests:
          - not_null
  - name: raw_subscription
    description: "Raw staging table for customer subscription status history."
    config:
      freshness:
        warn_after:
          count: 20
          period: hour
        error_after:
          count: 24
          period: hour
      loaded_at_field: load_ts
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - subscription_hash_diff
            - filename
    columns:
      - name: subscription_hash_diff
        description: "Surrogate key for the subscription record."
        tests:
          - not_null
  - name: raw_weather
    description: "Raw staging table for regional weather observations."
    config:
      freshness:
        warn_after:
          count: 20
          period: hour
        error_after:
          count: 24
          period: hour
      loaded_at_field: load_ts
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - weather_hash_diff
            - filename
    columns:
      - name: weather_hash_diff
        description: "Surrogate key for the weather observation record."
        tests:
          - not_null
  - name: raw_customer_interaction
    description: "Raw staging table for customer touchpoints and event logs."
    config:
      freshness:
        warn_after:
          count: 20
          period: hour
        error_after:
          count: 24
          period: hour
      loaded_at_field: load_ts
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - customer_interaction_hash_diff
            - filename
    columns:
      - name: customer_interaction_hash_diff
        description: "Surrogate key for a customer interaction event."
        tests:
          - not_null
