version: '1.0.0'

models:
  - name: stg_customer
    description: "Customer staging dbt model"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - customer_hash_diff
            - source_file_name
    columns:
      - name: customer_hash_diff
        description: "The primary key for this table"
        tests:
          - not_null
      - name: customer_id
        description: "Customer id"
        tests:
          - not_null
      - name: customer_name
        description: "Customer name"
        config:
          meta:
            contains_pii: true 
      - name: customer_email
        description: "Customer email"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              regex: "^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+$"
        config:
          meta:
            contains_pii: true 
      - name: start_date
        description: "The primary key for this table"
        tests:
          - not_null
      - name: end_date
        description: "The primary key for this table"
        tests:
          - not_null
      - name: status
        description: "The primary key for this table"
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'cancelled']
      - name: source_file_name
        description: "Raw file name"
      - name: load_ts
        description: "Load timestamp"
  - name: stg_product
    description: "A starter dbt model"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_hash_diff
            - source_file_name
    columns:
      - name: product_hash_diff
        description: "The primary key for this table"
        tests:
          - not_null
      - name: product_id
        description: "Product ID"
      - name: product_name
        description: "Product name"
      - name: product_category_id
        description: "Product category id"
      - name: source_file_name
        description: "Raw file name"
      - name: load_ts
