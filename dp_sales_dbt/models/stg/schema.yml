version: 2

models:
  - name: stg_customer
    description: "Staging model for customer data including record history"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - customer_hash_diff
            - source_file_name
    columns:
      - name: customer_hash_diff
        description: "Unique hash representing the customer record for change detection"
        tests:
          - not_null
      - name: customer_id
        description: "Unique identifier for the customer."
        tests:
          - not_null
      - name: customer_name
        description: "Full name of the customer"
        config:
          meta:
            contains_pii: true
      - name: customer_email
        description: "Customer email address used for communication"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              regex: "^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+$"
        config:
          meta:
            contains_pii: true
      - name: start_date
        description: "Effective start date for the customer record"
        tests:
          - not_null
      - name: end_date
        description: "Effective end date for the customer record"
        tests:
          - not_null
      - name: status
        description: "Account status (e.g., active, cancelled)"
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'cancelled']
      - name: source_file_name
        description: "The name of the source file from which the data was ingested."
      - name: load_ts
        description: "Load timestamp"
  - name: stg_product
    description: "Staging model for product master data"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_hash_diff
            - source_file_name
    columns:
      - name: product_hash_diff
        description: "Unique hash for product record change tracking"
        tests:
          - not_null
      - name: product_id
        description: "Primary identifier for the product."
        tests:
          - not_null
      - name: product_name
        description: "Descriptive name of the product"
      - name: product_category_id
        description: "Reference to the product category table."
      - name: source_file_name
        description: "The name of the source file from which the data was ingested."
      - name: load_ts
        description: "The timestamp indicating when the data was loaded into the staging layer."
  - name: stg_product_category
    description: "Detailed staging model for product categories and inventory details"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_category_hash_diff
            - source_file_name
    columns:
      - name: product_category_hash_diff
        description: "Unique hash for product category and attribute change tracking"
        tests:
          - not_null
      - name: product_id
        description: "Product identifier"
        tests:
          - not_null
      - name: category_id
        description: "Category identifier"
        tests:
          - not_null
      - name: category_name
        description: "Primary category name"
      - name: subcategory
        description: "Detailed sub-category name"
      - name: brand
        description: "Brand associated with the product"
      - name: supplier_id
        description: "Identifier for the product supplier"
      - name: cost_price
        description: "The price at which the item is purchased from the supplier"
      - name: retail_price
        description: "The list price for consumers"
      - name: margin_percent
        description: "Calculated profit margin percentage"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
              config:
                severity: warn
      - name: stock_level
        description: "Current quantity available in stock"
      - name: reorder_point
        description: "Minimum stock level before a new order is triggered"
      - name: discontinued
        description: "Boolean indicating if the product is discontinued"
      - name: launch_date
        description: "The date the product was officially launched"
      - name: source_last_updated_date
        description: "Timestamp of last update in the source system"
      - name: source_file_name
        description: "The name of the source file from which the data was ingested."
      - name: load_ts
        description: "The timestamp indicating when the data was loaded into the staging layer."
  - name: stg_sales
    description: "Staging model for transactional sales data"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - sales_hash_diff
            - source_file_name
    columns:
      - name: sales_hash_diff
        description: "Unique hash for the sale transaction"
        tests:
          - not_null
      - name: order_id
        description: "Unique identifier for the order"
        tests:
          - not_null
      - name: product_id
        description: "Reference to the product purchased"
        tests:
          - not_null
      - name: customer_id
        description: "Reference to the customer who made the purchase"
        tests:
          - not_null
      - name: order_date
        description: "The date the order was placed"
        tests:
          - not_null
      - name: order_amount
        description: "Gross total value of the order"
        tests:
          - not_null
      - name: order_quantity
        description: "Number of units purchased"
        tests:
          - not_null
      - name: payment_method
        description: "Method used for payment (e.g., paypal, credit_card)"
        tests:
          - not_null
          - accepted_values:
              values: ['paypal', 'credit_card', 'debit_card', 'bank_transfer']
      - name: discount_applied
        description: "The amount or percentage of discount applied to the sale."
      - name: shipping_cost
        description: "The cost associated with shipping the order."
      - name: created_at
        description: "The timestamp when the sales record was created in the source system."
        tests:
          - not_null
      - name: source_file_name
        description: "The name of the source file from which the data was ingested."
      - name: load_ts
        description: "The timestamp indicating when the data was loaded into the staging layer."
  - name: stg_subscription
    description: "Staging model for customer subscription plans"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - subscription_hash_diff
            - source_file_name
    columns:
      - name: subscription_hash_diff
        description: "Unique hash for the subscription record"
        tests:
          - not_null
      - name: customer_id
        description: "Reference to the customer holding the subscription."
        tests:
          - not_null
      - name: subscription_id
        description: "Unique identifier for the subscription."
        tests:
          - not_null
      - name: plan_type
        description: "Type of subscription plan (e.g., Basic, Premium)"
        tests:
          - not_null
          - accepted_values:
              values: ['Enterprise', 'Basic', 'Premium']
      - name: subscription_start_date
        description: "Start date of the subscription period"
        tests:
          - not_null
      - name: subscription_end_date
        description: "End date of the subscription period"
        tests:
          - not_null
      - name: monthly_fee
        description: "The recurring monthly cost of the subscription"
        tests:
          - not_null
      - name: status
        description: "Current status of the subscription"
        tests:
          - not_null
          - accepted_values:
              values: ['Active', 'Cancelled']
      - name: source_file_name
        description: "The name of the source file from which the data was ingested."
      - name: load_ts
        description: "The timestamp indicating when the data was loaded into the staging layer."
  - name: stg_weather
    description: "Staging model for external weather data"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - weather_hash_diff
            - source_file_name
    columns:
      - name: weather_hash_diff
        description: "Unique hash for the weather record"
        tests:
          - not_null
      - name: weather_date
        description: "The date of the weather observation"
        tests:
          - not_null
      - name: temperature
        description: "Measured temperature in Celsius"
        tests:
          - not_null
      - name: precipitation
        description: "Amount of precipitation recorded"
        tests:
          - not_null
      - name: city
        description: "The city where the observation was made"
        tests:
          - not_null
      - name: source_file_name
        description: "The name of the source file from which the data was ingested."
      - name: load_ts
        description: "The timestamp indicating when the data was loaded into the staging layer."
  - name: stg_customer_interaction
    description: "Staging model for customer behavioral events"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - customer_interaction_hash_diff
            - source_file_name
    columns:
      - name: customer_interaction_hash_diff
        description: "Unique hash for the interaction event"
        tests:
          - not_null
      - name: customer_id
        description: "Identifier for the interacting customer"
        tests:
          - not_null
      - name: product_id
        description: "Identifier for the product involved in the interaction"
        tests:
          - not_null
      - name: interaction_type
        description: "Type of interaction (e.g., view, add_to_cart)"
        tests:
          - not_null
          - accepted_values:
              values: ['view', 'purchase', 'add_to_cart']
      - name: interaction_ts
        description: "Timestamp of the interaction event"
        tests:
          - not_null
      - name: source_file_name
        description: "The name of the source file from which the data was ingested."
      - name: load_ts
        description: "The timestamp indicating when the data was loaded into the staging layer."
