          - not_null
      - name: product_id
        description: "Product id"
      - name: category_id
        description: "Category id"
      - name: category_name
        description: "Category name"
      - name: subcategory
        description: "Sub category name"
      - name: brand
        description: "Brand name"
      - name: supplier_id
        description: "Supplier id"
      - name: cost_price
        description: "Cost price"
      - name: retail_price
        description: "Retail price"
      - name: margin_percent
        description: "Margin percent"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
              config:
                severity: warn
      - name: stock_level
        description: "Raw file name"
      - name: reorder_point
        description: "Raw file name"
      - name: discontinued
        description: "Raw file name"
      - name: launch_date
        description: "Raw file name"
      - name: source_last_updated_date
        description: "Raw file name"
      - name: source_file_name
        description: "Raw file name"
      - name: load_ts
        description: "Load timestamp"
