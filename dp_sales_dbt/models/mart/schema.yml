version: 2

models:
  - name: dim_date
    description: "Standard calendar dimension table."
    columns:
      - name: date_key
        tests:
          - not_null
          - unique

  - name: dim_customer
    description: "Customer dimension table."
    columns:
      - name: customer_id
        tests:
          - not_null
      - name: customer_name
        description: "Full name of the customer."
      - name: valid_from
        description: "Start of record validity (SCD Type 2)."
      - name: valid_to
        description: "End of record validity (SCD Type 2)."

  - name: dim_product
    description: "Product dimension table."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
      - name: product_name
        description: "Descriptive name of the product."
      - name: product_category_id
        description: "Reference to the product category."

  - name: fact_sales
    description: "Core sales transactions fact table."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: order_date
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: order_amount
        description: "Gross total of the sale."
      - name: order_quantity
        description: "Number of units sold."
      - name: discount_applied
        description: "Percentage discount applied to the order."
      - name: shipping_cost
        description: "Calculated shipping cost for the order."
      - name: payment_method
        tests:
          - accepted_values:
              values: ['paypal', 'credit_card', 'debit_card', 'bank_transfer']

  - name: fact_customer_interaction
    description: "Fact table for tracking customer engagement events."
    columns:
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: interaction_type
        tests:
          - accepted_values:
              values: ['view', 'purchase', 'add_to_cart']
      - name: interaction_ts
        description: "Timestamp of the interaction event."

  - name: fact_weather
    description: "Fact table capturing daily weather data by city."
    columns:
      - name: weather_date
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: city
        tests:
          - not_null
      - name: temperature
        description: "Average temperature for the day."
      - name: precipitation
        description: "Total precipitation recorded."

  - name: fact_review_order
    description: "Operational view flagging orders with high discounts or shipping costs for audit."
    columns:
      - name: order_id
        tests:
          - not_null

  - name: agg_daily_revenue
    description: "Aggregation of revenue and order volume by date."
    columns:
      - name: order_date
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: total_order_amount
        description: "Total revenue for the day."
      - name: order_count
        description: "Total number of orders."
      - name: unique_customer_count
        description: "Number of unique customers who purchased."

  - name: agg_customer_order
    description: "Metrics for customer lifetime value and segmentation."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: customer_name
        description: "Customer name from dim_customer."
      - name: total_order_amount
        description: "Lifetime total order value."
      - name: total_order_count
        description: "Lifetime order count."
      - name: customer_tier
        description: "Classification of customers: High Value, Medium Value, or Low Value."
        tests:
          - accepted_values:
              values: ['High Value', 'Medium Value', 'Low Value']

  - name: agg_payment_method_order
    description: "Market share and average value of orders by payment method."
    columns:
      - name: payment_method
        tests:
          - not_null
          - unique
      - name: total_revenue
        description: "Total revenue generated by this payment method."
      - name: average_order_value
        description: "Average amount per order for this method."
      - name: order_count
        description: "Total number of orders using this method."
      - name: payment_method_pct
        description: "Percentage share of total revenue."

  - name: agg_payment_method_monthly_revenue
    description: "Monthly revenue aggregates per product category with payment method distribution."
    columns:
      - name: month_key
        tests:
          - not_null
      - name: product_category_id
        tests:
          - not_null
      - name: total_revenue
        description: "Total monthly revenue for the category."
      - name: monthly_order_volatility
        description: "Coefficient of variation for order amounts."
      - name: total_revenue_credit_card
        description: "Revenue from credit cards."
      - name: total_revenue_paypal
        description: "Revenue from PayPal."
      - name: total_revenue_credit_card_pct
        description: "Percentage of revenue from credit cards."

  - name: agg_monthly_sales_metrics
    description: "Strategic monthly performance indicators including volatility and growth."
    columns:
      - name: month_key
        tests:
          - not_null
      - name: product_category_id
        tests:
          - not_null
      - name: total_revenue
        description: "Monthly revenue from agg_payment_method_monthly_revenue."
      - name: quarterly_total_revenue
        description: "Running total of revenue within the quarter."
      - name: qoq_growth_rate
        description: "Quarter-over-Quarter growth rate."
      - name: best_month_flag
        description: "True if this was the highest revenue month for the category."
      - name: worst_month_flag
        description: "True if this was the lowest revenue month for the category."
      - name: sales_volatility_coefficient
        description: "Volatility measure passed through from monthly aggregates."
